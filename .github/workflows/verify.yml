name: Mathematical checks

on:
  push:
  pull_request:

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r verification/requirements.txt
      - run: python verification/run_all.py --json verification/report.json
      - run: python verification/check_repository.py --json verification/structure_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: finite-mathematical-checks
          path: |
            verification/report.json
            verification/structure_report.json
